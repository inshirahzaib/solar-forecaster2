name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser tools
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run wake script
        run: python .github/scripts/wake.py
        env:
          APP_URL: "https://solar-forecaster2-inshirahzaib.streamlit.app/"
